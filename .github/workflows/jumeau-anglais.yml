name: Version anglaise des articles

# Se lance quand un article francais est enregistre (Keystatic fait un commit sur main).
# Le script traduit l'article en anglais (DeepL API Free) si la case est cochee, puis l'action le commite.
# Le secret DEEPL_API_KEY doit exister : Settings > Secrets and variables > Actions.
on:
  push:
    branches: [main]
    paths:
      - "src/data/posts/fr/**"

permissions:
  contents: write

# Une seule execution a la fois, sans en annuler une en cours.
concurrency:
  group: jumeau-anglais
  cancel-in-progress: false

jobs:
  jumeau:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer l'outil YAML
        run: npm install --prefix "$RUNNER_TEMP/outils" yaml@2

      - name: Traduire et creer les versions anglaises
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          OUTILS_NODE: ${{ runner.temp }}/outils
        run: node scripts/jumeau-anglais.mjs

      - name: Enregistrer le resultat
        if: always()
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data/posts
            git commit -m "Version anglaise creee automatiquement"
            git pull --rebase origin main
            git push origin main
          fi
          