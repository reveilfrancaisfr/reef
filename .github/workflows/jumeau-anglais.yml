name: Version anglaise des articles

# Se lance quand un article francais est enregistre (Keystatic fait un commit sur main).
# Le script cree la copie anglaise si la case est cochee, puis l'action la commite.
on:
  push:
    branches: [main]
    paths:
      - "src/data/posts/fr/**"

permissions:
  contents: write

# Une seule execution a la fois, sans en annuler une en cours.
concurrency:
  group: jumeau-anglais
  cancel-in-progress: false

jobs:
  jumeau:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Creer les versions anglaises
        run: node scripts/jumeau-anglais.mjs

      - name: Enregistrer le resultat
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data/posts
            git commit -m "Version anglaise creee automatiquement"
            git pull --rebase origin main
            git push origin main
          fi
          